<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Teste: erro no desenho</title></head>
<body>
<!-- Se o desenho do Painel der erro, a mensagem com "Tentar de novo" tem de continuar na tela (nunca tela branca). -->
<div id="alvo"></div><div id="tip"></div>
<script src="../js/config.js"></script>
<script>Crono.esc = t => String(t ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));</script>
<script src="../js/banco.js"></script>
<script src="../js/painel-calculo.js"></script>
<script src="../js/painel.js"></script>
<script>
(async function () {
  const pagina = await (await fetch('../index.html?' + Date.now())).text();
  const doc = new DOMParser().parseFromString(pagina, 'text/html');
  document.getElementById('alvo').append(doc.getElementById('tela-painel'));
  Crono.banco.listarRegistros = async () => [{ data: '2026-10-01', origem: 'folha' }];
  Crono.calcularPainel = () => { throw new Error('falha de teste'); };
  await Crono.painel.iniciar();
  const estado = document.getElementById('painelEstado');
  document.title = estado && estado.isConnected && /Tentar de novo/.test(estado.textContent) ? 'OK erro visivel' : 'FALHA tela branca';
})();
</script>
</body></html>
